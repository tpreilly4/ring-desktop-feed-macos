name: RingDesktopFeed
options:
  bundleIdPrefix: com.tompreilly
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RingDesktopFeed:
    type: application
    platform: macOS
    sources:
      - App/Sources
    settings:
      base:
        PRODUCT_NAME: Ring Desktop Feed
        PRODUCT_BUNDLE_IDENTIFIER: com.tompreilly.ringdesktopfeed
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ring Desktop Feed
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_FILE: App/Info.plist
        # Team comes from Local.xcconfig (DEVELOPMENT_TEAM). A stable signature
        # stops macOS asking for Keychain access after every rebuild.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        # The embed script reads build/ and vendor/ from the repo.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed helper
        script: '"$SRCROOT/scripts/embed-helper.sh"'
        basedOnDependencyAnalysis: false
