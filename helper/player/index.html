<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ring Desktop Feed</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #000;
        --fg: #f2f2f2;
        --muted: #a0a0a0;
        --chip: rgba(0, 0, 0, 0.55);
        --accent: #2f7cf6;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: var(--bg);
        display: block;
      }
      #status {
        position: absolute;
        left: 8px;
        top: 8px;
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--chip);
        font-weight: 500;
      }
      #status[data-state='live']::before {
        content: '';
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #e5484d;
        margin-right: 6px;
        vertical-align: 1px;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        background: rgba(0, 0, 0, 0.6);
      }
      #overlay.shown { display: flex; }
      #overlay p { margin: 0; color: var(--muted); max-width: 80%; text-align: center; }
      button {
        font: inherit;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 7px;
        padding: 6px 14px;
        cursor: pointer;
      }
      #cameras {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 16px;
      }
      #cameras.shown { display: flex; }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted></video>
    <div id="status" data-state="idle"></div>
    <div id="overlay"><p id="overlay-text"></p><button id="resume" type="button">Resume live</button></div>
    <div id="cameras"></div>
    <script type="module" src="/player/player.js"></script>
  </body>
</html>
